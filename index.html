<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Agent Demo - 小虾遥控版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 12px; margin-bottom: 20px; }
    h1 { font-size: 24px; margin-bottom: 10px; }
    .status { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 15px; }
    .status-item { background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 6px; font-size: 13px; }
    .status-item.connected { background: #10b981; }
    .status-item.disconnected { background: #ef4444; }
    .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .panel h2 { font-size: 18px; margin-bottom: 15px; color: #333; border-bottom: 2px solid #667eea; padding-bottom: 10px; }
    #demo-area { min-height: 400px; border: 2px dashed #ddd; border-radius: 8px; padding: 20px; background: #fafafa; }
    #demo-area h3 { color: #666; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; color: #555; font-size: 14px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .btn { background: #667eea; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
    .btn:hover { background: #5568d3; transform: translateY(-2px); }
    .btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }
    #log-container { max-height: 300px; overflow-y: auto; background: #1e1e1e; border-radius: 8px; padding: 15px; font-family: 'Monaco', 'Consolas', monospace; font-size: 12px; }
    .log-entry { margin-bottom: 8px; padding: 5px; border-radius: 4px; }
    .log-entry.info { color: #60a5fa; }
    .log-entry.success { color: #34d399; }
    .log-entry.error { color: #f87171; }
    .log-entry.command { color: #fbbf24; }
    #ws-url-input { font-family: monospace; }
    .quick-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
    .quick-actions button { padding: 8px 16px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🦐 Page Agent Demo - 小虾遥控版</h1>
      <p>通过 WebSocket 接收远程指令，控制页面操作</p>
      <div class="status">
        <span class="status-item" id="ws-status">WebSocket: 未连接</span>
        <span class="status-item" id="agent-status">Page Agent: 未初始化</span>
      </div>
    </header>

    <div class="main-content">
      <div class="panel">
        <h2>📡 WebSocket 配置</h2>
        <div class="form-group">
          <label>WebSocket 服务器地址</label>
          <input type="text" id="ws-url-input" placeholder="wss://xxx.ngrok.io">
        </div>
        <button class="btn" id="connect-btn" onclick="connectWS()">连接</button>
        <button class="btn" id="disconnect-btn" onclick="disconnectWS()" disabled>断开</button>
        
        <h3 style="margin-top: 20px; font-size: 16px;">🎯 快捷测试</h3>
        <div class="quick-actions">
          <button class="btn" onclick="testAction('fill')">填充表单</button>
          <button class="btn" onclick="testAction('click')">点击按钮</button>
          <button class="btn" onclick="testAction('scroll')">滚动页面</button>
        </div>
      </div>

      <div class="panel">
        <h2>📜 指令日志</h2>
        <div id="log-container"></div>
      </div>
    </div>

    <div class="panel" style="margin-top: 20px;">
      <h2>🎮 Demo 操作区</h2>
      <div id="demo-area">
        <h3>这是一个模拟的表单页面</h3>
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="username" placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="password" placeholder="请输入密码">
        </div>
        <div class="form-group">
          <label>邮箱</label>
          <input type="email" id="email" placeholder="请输入邮箱">
        </div>
        <div class="form-group">
          <label>角色</label>
          <select id="role">
            <option value="">请选择角色</option>
            <option value="admin">管理员</option>
            <option value="user">普通用户</option>
            <option value="guest">访客</option>
          </select>
        </div>
        <button class="btn" id="submit-btn" style="margin-top: 10px;">提交</button>
        <button class="btn" id="reset-btn" style="margin-top: 10px; background: #6b7280;">重置</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/page-agent@1.5.7/dist/iife/page-agent.demo.js"></script>
  <script>
    let ws = null;
    let pageAgent = null;

    // 日志函数
    function log(message, type = 'info') {
      const container = document.getElementById('log-container');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const time = new Date().toLocaleTimeString('zh-CN');
      entry.textContent = `[${time}] ${message}`;
      container.appendChild(entry);
      container.scrollTop = container.scrollHeight;
    }

    // 更新状态
    function updateStatus(type, connected) {
      const el = document.getElementById(`${type}-status`);
      if (connected) {
        el.className = 'status-item connected';
        el.textContent = type === 'ws' ? 'WebSocket: 已连接' : 'Page Agent: 已就绪';
      } else {
        el.className = 'status-item disconnected';
        el.textContent = type === 'ws' ? 'WebSocket: 未连接' : 'Page Agent: 未初始化';
      }
    }

    // 初始化 Page Agent
    function initPageAgent() {
      try {
        pageAgent = new PageAgent({
          model: 'qwen3.5-plus',
          baseURL: 'https://dashscope.aliyuncs.com/compatible-mode/v1',
          apiKey: 'sk-your-api-key', // 可配置
          language: 'zh-CN',
        });
        updateStatus('agent', true);
        log('Page Agent 初始化成功', 'success');
      } catch (e) {
        log(`Page Agent 初始化失败：${e.message}`, 'error');
      }
    }

    // 连接 WebSocket
    function connectWS() {
      const url = document.getElementById('ws-url-input').value.trim();
      if (!url) {
        log('请输入 WebSocket 地址', 'error');
        return;
      }

      try {
        ws = new WebSocket(url);
        
        ws.onopen = () => {
          log(`已连接到 ${url}`, 'success');
          updateStatus('ws', true);
          document.getElementById('connect-btn').disabled = true;
          document.getElementById('disconnect-btn').disabled = false;
        };

        ws.onmessage = async (event) => {
          try {
            const data = JSON.parse(event.data);
            log(`收到指令：${JSON.stringify(data)}`, 'command');
            
            if (data.action === 'execute' && data.command) {
              await executeCommand(data.command);
            } else if (data.action === 'ping') {
              ws.send(JSON.stringify({ action: 'pong', timestamp: Date.now() }));
            }
          } catch (e) {
            log(`处理指令失败：${e.message}`, 'error');
          }
        };

        ws.onclose = () => {
          log('WebSocket 连接已关闭', 'info');
          updateStatus('ws', false);
          document.getElementById('connect-btn').disabled = false;
          document.getElementById('disconnect-btn').disabled = true;
        };

        ws.onerror = (error) => {
          log(`WebSocket 错误：${error.message}`, 'error');
        };

      } catch (e) {
        log(`连接失败：${e.message}`, 'error');
      }
    }

    // 断开 WebSocket
    function disconnectWS() {
      if (ws) {
        ws.close();
        ws = null;
      }
    }

    // 执行命令（使用 Page Agent）
    async function executeCommand(command) {
      if (!pageAgent) {
        log('Page Agent 未初始化，尝试初始化...', 'info');
        initPageAgent();
      }

      log(`执行：${command}`, 'command');
      
      try {
        // 简单命令直接操作 DOM，复杂命令用 Page Agent
        if (command.includes('填充') || command.includes('输入')) {
          await executeFill(command);
        } else if (command.includes('点击')) {
          await executeClick(command);
        } else if (command.includes('滚动')) {
          await executeScroll(command);
        } else if (pageAgent) {
          await pageAgent.execute(command);
          log('Page Agent 执行完成', 'success');
        } else {
          log('无法执行命令，需要 Page Agent 或直接 DOM 操作', 'error');
        }
      } catch (e) {
        log(`执行失败：${e.message}`, 'error');
      }
    }

    // 填充表单
    async function executeFill(command) {
      if (command.includes('用户名')) {
        document.getElementById('username').value = 'test_user';
        log('已填充用户名：test_user', 'success');
      } else if (command.includes('密码')) {
        document.getElementById('password').value = '123456';
        log('已填充密码：123456', 'success');
      } else if (command.includes('邮箱')) {
        document.getElementById('email').value = 'test@example.com';
        log('已填充邮箱：test@example.com', 'success');
      } else if (command.includes('角色')) {
        document.getElementById('role').value = 'user';
        log('已选择角色：user', 'success');
      }
    }

    // 点击操作
    async function executeClick(command) {
      if (command.includes('提交')) {
        document.getElementById('submit-btn').click();
        log('已点击提交按钮', 'success');
      } else if (command.includes('重置')) {
        document.getElementById('reset-btn').click();
        log('已点击重置按钮', 'success');
      }
    }

    // 滚动操作
    async function executeScroll(command) {
      window.scrollBy(0, 200);
      log('已向下滚动 200px', 'success');
    }

    // 快捷测试
    function testAction(type) {
      const commands = {
        fill: '填充用户名和密码',
        click: '点击提交按钮',
        scroll: '滚动页面'
      };
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'execute', command: commands[type] }));
        log(`发送测试指令：${commands[type]}`, 'info');
      } else {
        log('请先连接 WebSocket', 'error');
      }
    }

    // 页面加载时初始化
    window.onload = () => {
      log('页面已加载', 'info');
      initPageAgent();
      
      // 从 URL 参数读取 WS 地址（如果有）
      const urlParams = new URLSearchParams(window.location.search);
      const wsUrl = urlParams.get('ws');
      if (wsUrl) {
        document.getElementById('ws-url-input').value = wsUrl;
        log(`从 URL 加载 WS 地址：${wsUrl}`, 'info');
      }
    };
  </script>
</body>
</html>
